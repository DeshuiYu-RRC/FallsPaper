default: &default
  adapter: mysql2
  encoding: utf8mb4
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV["DATABASE_USERNAME"] || "admin" %>
  password: <%= ENV["DATABASE_PASSWORD"] || "fallspaper" %>
  host: <%= ENV["DATABASE_HOST"] || "db" %>

development:
  <<: *default
  database: <%= ENV["DATABASE_NAME"] || "fallspaper" %>

test:
  <<: *default
  database: fallspaper_test

production:
  <<: *default
  database: fallspaper_production
  username: fallspaper
  password: <%= ENV["FALLSPAPER_DATABASE_PASSWORD"] %>
